<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c12"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="#2e3346" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="48" cy="18" r="16" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Modern Geometric "K" -->
  <!-- Vertical Left Stem -->
  <rect x="16" y="14" width="7.5" height="36" rx="3.75" fill="url(#stemGrad)"/>

  <!-- Upper Diagonal Arm -->
  <path d="M22 32 L39.5 16.5 C40.8 15.3 43 16.2 43 18 L43 20 C43 21 42.5 21.9 41.7 22.6 L29 34 Z" fill="url(#stemGrad)"/>

  <!-- Lower Diagonal Leg -->
  <path d="M25 30 L42.5 48 C43.5 49 44.2 50 42.8 50 L38 50 C36.8 50 35.7 49.3 35 48.4 L22 34 Z" fill="url(#stemGrad)"/>

  <!-- Dynamic Career Spark Accent (Gold) -->
  <circle cx="45" cy="17" r="4" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="45" cy="17" r="2.2" fill="#fffbeb"/>
</svg>
