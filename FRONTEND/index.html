<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>KAREERIST – AI-Powered Career Intelligence Platform</title>
  <meta name="description"
    content="Stop guessing your career path. Kareerist uses AI to analyze your profile, simulate real hiring standards, and guide your career with clarity." />
  <meta name="author" content="Kareerist" />

  <!-- CSP is enforced by the backend SecurityHeadersMiddleware in production.
       A meta CSP tag here would break Vite HMR in dev mode, so it is omitted. -->

  <!-- Google Fonts — Inter & Instrument Serif with display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="canonical" href="https://kareerist.com" />

  <meta property="og:title" content="KAREERIST – AI-Powered Career Intelligence Platform" />
  <meta property="og:description"
    content="Stop guessing your career path. Kareerist uses AI to simulate real hiring standards, analyze resumes against ATS filters, provide adaptive mock interviews, and build personalized roadmaps." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kareerist.com" />
  <meta property="og:image" content="https://kareerist.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="KAREERIST – AI-Powered Career Intelligence Platform" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Kareerist" />
  <meta name="twitter:title" content="KAREERIST – AI-Powered Career Intelligence Platform" />
  <meta name="twitter:description" content="Simulate real hiring standards, score resumes with ATS filters, practice voice mock interviews, and build personalized roadmaps." />
  <meta name="twitter:image" content="https://kareerist.com/og-image.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Kareerist",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "AI-powered career intelligence platform providing ATS resume scoring, voice mock interviews, and personalized career roadmaps.",
    "url": "https://kareerist.com",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- External theme init: prevents flash of wrong theme before React loads (no inline script needed) -->
  <script src="/theme-init.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
